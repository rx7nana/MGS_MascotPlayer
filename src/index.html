<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MGS_MascotPlayer</title><link rel="stylesheet" href="ui.css"><body data-window="main" class="design-B" data-text-mode="C" data-layout="A"><canvas id="visualizer"></canvas><canvas id="mascot"></canvas><button id="move" class="hover-ui" title="ドラッグでウィンドウ移動" aria-label="ウィンドウ移動">✣</button><section id="mini" aria-label="ミニプレイリスト"><div id="tracks"></div><div id="drop-hint">MML / MGSを追加<br><small>ここにドロップ</small></div></section><div id="loading">読み込み中…</div><footer id="controls" class="hover-ui" aria-label="再生コントロール" inert><div id="progress-row"><time id="elapsed">0:00</time><input id="seek" aria-label="再生位置" type="range" min="0" max="300" step=".1" value="0"><time id="total">5:00</time></div><div class="control-grid"><div class="transport" role="group" aria-label="再生操作"><button id="shuffle" title="シャッフル" aria-label="シャッフル">⤨</button><button id="prev" title="前の曲" aria-label="前の曲">◀│</button><button id="play" class="primary" title="再生・一時停止" aria-label="再生・一時停止">▶</button><button id="stop" title="停止" aria-label="停止">■</button><button id="next" title="次の曲" aria-label="次の曲">│▶</button><button id="repeat" title="リピート OFF" aria-label="リピート OFF">↻ <small>OFF</small></button><label class="volume"><button id="volume-trigger" title="音量ポップアップ" aria-label="音量ポップアップ"></button><input id="volume" aria-label="音量" type="range" min="0" max="1" step=".01"></label></div><div class="mascot-tools" role="group" aria-label="マスコット操作"><button id="instrument" title="ショルダーキーボード表示 ON" aria-label="ショルダーキーボード表示">♫<span class="tool-label">楽器</span></button><button id="size" title="表示サイズ 100%" aria-label="表示サイズ">⤢<span class="tool-label">100%</span></button><button id="angle" title="モデルの向き 0°" aria-label="モデルの向き">⟳<span class="tool-label">0°</span></button></div><button id="gear" title="設定" aria-label="設定">⚙</button></div><div id="popup" hidden><label id="popup-label"></label><input id="popup-range" type="range"><output id="popup-value" aria-live="polite"></output><button id="popup-close" aria-label="ポップアップを閉じる">×</button></div></footer><button id="quit" class="hover-ui" title="終了" aria-label="終了">×</button><link rel="stylesheet" href="skin-g.css"><link rel="stylesheet" href="theme-colors.css"><script src="themes.js"></script><script src="icons-g.js"></script><script src="host-bridge.js"></script><script type="module" src="ui.js"></script></body></html>
